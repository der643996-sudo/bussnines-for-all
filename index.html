<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bussnines for all</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Markazi+Text:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ========== THEME: ACADEMIC / CALM ========== */
  :root{
    --paper:#F4F1EA;
    --paper-2:#EDE9DF;
    --surface:#FBF9F4;
    --surface-2:#FFFFFF;
    --line:#DCD5C4;
    --line-soft:#E8E2D3;

    --ink:#2A2C2E;
    --ink-soft:#5C5F63;
    --ink-faint:#8B8E92;

    --navy:#2C4257;
    --navy-deep:#1E2E3D;
    --navy-soft:#E4EAF0;

    --gold:#A88B4E;
    --gold-deep:#8A6F38;
    --gold-soft:#F2EBD9;

    --olive:#6B7355;

    --radius:12px;
    --radius-lg:16px;
    --shadow:0 1px 2px rgba(42,44,46,.04), 0 10px 24px -14px rgba(42,44,46,.15);
    --shadow-lift:0 4px 8px rgba(42,44,46,.05), 0 20px 40px -18px rgba(42,44,46,.22);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    background:
      radial-gradient(900px 400px at 85% -5%, rgba(44,66,87,.05), transparent 60%),
      radial-gradient(700px 350px at 0% 0%, rgba(168,139,78,.06), transparent 55%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    line-height:1.6;
  }
  ::selection{background:var(--gold-soft); color:var(--navy-deep);}
  :focus-visible{outline:2px solid var(--navy); outline-offset:3px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  /* ========== TOP BAR ========== */
  header{
    padding:24px clamp(20px,5vw,72px) 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    border-bottom:1px solid var(--line-soft);
    background:rgba(244,241,234,.85);
    backdrop-filter:blur(10px);
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand-mark{
    width:44px; height:44px;
    border-radius:50%;
    background:var(--navy);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    border:1px solid var(--navy-deep);
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.06);
  }
  .brand-mark svg{width:20px; height:20px; stroke:var(--gold-soft);}
  .brand-text{display:flex; flex-direction:column; line-height:1.2;}
  .brand-name{
    font-family:'Markazi Text', serif;
    font-weight:700;
    font-size:23px;
    letter-spacing:.3px;
    color:var(--navy-deep);
  }
  .brand-tag{
    font-family:'Amiri', serif;
    font-size:12px;
    color:var(--gold-deep);
    letter-spacing:2px;
    font-weight:700;
    text-transform:uppercase;
  }

  nav.crumbs{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:13.5px;
    color:var(--ink-faint);
    flex-wrap:wrap;
  }
  nav.crumbs .crumb{
    cursor:pointer;
    padding:7px 13px;
    border-radius:8px;
    transition:background .18s ease, color .18s ease;
    white-space:nowrap;
  }
  nav.crumbs .crumb:hover{background:var(--surface); color:var(--navy);}
  nav.crumbs .crumb.current{
    color:var(--navy-deep);
    font-weight:600;
    cursor:default;
    background:var(--gold-soft);
  }
  nav.crumbs .crumb.current:hover{background:var(--gold-soft);}
  nav.crumbs .sep{color:var(--line); font-size:12px; margin:0 2px;}

  /* ========== MAIN ========== */
  main{
    flex:1;
    padding:10px clamp(20px,5vw,72px) 80px;
    position:relative;
    max-width:1180px;
    width:100%;
    margin:0 auto;
  }

  .screen{display:none;}
  .screen.active{display:block; animation:rise .5s cubic-bezier(.22,.61,.36,1);}
  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .screen-head{
    margin:36px 0 36px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    padding-bottom:20px;
    border-bottom:1px solid var(--line-soft);
  }
  .screen-title{
    font-family:'Markazi Text', serif;
    font-size:clamp(30px,4.2vw,44px);
    font-weight:700;
    letter-spacing:.2px;
    color:var(--navy-deep);
    line-height:1.15;
  }
  .screen-title::after{
    content:"";
    display:block;
    width:48px;
    height:3px;
    background:var(--gold);
    margin-top:12px;
    border-radius:2px;
  }
  .screen-sub{
    margin-top:12px;
    color:var(--ink-soft);
    font-size:15.5px;
    max-width:52ch;
    font-family:'Amiri', serif;
    font-size:17px;
  }

  /* ========== CARD GRID ========== */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px,1fr));
    gap:20px;
  }
  .card{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:0;
    cursor:pointer;
    text-align:right;
    transition:transform .24s cubic-bezier(.22,.61,.36,1), box-shadow .24s ease, border-color .24s ease;
    position:relative;
    overflow:hidden;
    opacity:0;
    animation:cardIn .55s cubic-bezier(.22,.61,.36,1) forwards;
  }
  .grid .card:nth-child(1){animation-delay:.02s;}
  .grid .card:nth-child(2){animation-delay:.07s;}
  .grid .card:nth-child(3){animation-delay:.12s;}
  .grid .card:nth-child(4){animation-delay:.17s;}
  .grid .card:nth-child(5){animation-delay:.22s;}
  .grid .card:nth-child(6){animation-delay:.27s;}
  @keyframes cardIn{
    from{opacity:0; transform:translateY(12px);}
    to{opacity:1; transform:translateY(0);}
  }
  .card::before{
    content:"";
    position:absolute;
    inset-inline-start:0; top:0; bottom:0;
    width:4px;
    background:var(--gold);
    transform:scaleY(0);
    transform-origin:top;
    transition:transform .3s ease;
  }
  .card:hover, .card:focus-visible{
    transform:translateY(-4px);
    box-shadow:var(--shadow-lift);
    border-color:#CFC7B2;
  }
  .card:hover::before, .card:focus-visible::before{transform:scaleY(1);}
  .card-inner{padding:26px 24px 24px;}
  .card .icon{
    width:46px; height:46px;
    border-radius:50%;
    background:var(--navy-soft);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:20px;
    border:1px solid #D6DEE7;
  }
  .card .icon svg{width:20px; height:20px; stroke:var(--navy);}
  .card .name{
    font-family:'Markazi Text', serif;
    font-size:19px;
    font-weight:700;
    line-height:1.35;
    color:var(--navy-deep);
  }
  .card .meta{
    margin-top:8px;
    font-size:13px;
    color:var(--ink-faint);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .card .meta::before{
    content:"";
    width:5px; height:5px;
    border-radius:50%;
    background:var(--gold);
    display:inline-block;
  }

  /* ========== FILE LIST ========== */
  .file-count{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--surface-2);
    border:1px solid var(--line);
    padding:9px 18px;
    border-radius:999px;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .file-count strong{color:var(--navy-deep); font-weight:700; font-size:15px;}

  .file-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .file-row{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:16px;
    transition:border-color .2s ease, box-shadow .2s ease;
    opacity:0;
    animation:cardIn .5s cubic-bezier(.22,.61,.36,1) forwards;
    position:relative;
  }
  .file-list .file-row:nth-child(1){animation-delay:.02s;}
  .file-list .file-row:nth-child(2){animation-delay:.06s;}
  .file-list .file-row:nth-child(3){animation-delay:.10s;}
  .file-list .file-row:nth-child(4){animation-delay:.14s;}
  .file-list .file-row:nth-child(5){animation-delay:.18s;}
  .file-list .file-row:nth-child(6){animation-delay:.22s;}
  .file-row:hover{
    border-color:#CFC7B2;
    box-shadow:var(--shadow);
  }
  .file-row .f-icon{
    width:44px; height:44px;
    border-radius:10px;
    background:var(--navy);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    position:relative;
  }
  .file-row .f-icon svg{width:18px; height:18px; stroke:#F4F1EA;}
  .file-row .f-tag{
    position:absolute;
    bottom:-6px; left:-6px;
    background:var(--gold);
    color:#fff;
    font-size:8px;
    font-weight:700;
    letter-spacing:.5px;
    padding:2px 5px;
    border-radius:4px;
    line-height:1.4;
  }
  .file-row .f-body{flex:1; min-width:0;}
  .file-row .f-name{
    font-family:'Markazi Text', serif;
    font-size:17px;
    font-weight:600;
    line-height:1.35;
    color:var(--navy-deep);
  }
  .file-row .f-meta{
    margin-top:4px;
    font-size:12.5px;
    color:var(--ink-faint);
  }

  .f-actions{
    display:flex;
    flex-direction:column;
    gap:8px;
    flex-shrink:0;
  }
  .f-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    padding:8px 15px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
    border:1px solid transparent;
    letter-spacing:.2px;
  }
  .f-btn svg{width:13px; height:13px; flex-shrink:0;}
  .f-btn:active{transform:scale(.97);}
  .f-btn.view{
    background:var(--navy);
    color:#F4F1EA;
  }
  .f-btn.view:hover{background:var(--navy-deep);}
  .f-btn.attach{
    background:transparent;
    border-color:var(--line);
    color:var(--ink-soft);
  }
  .f-btn.attach:hover{
    border-color:var(--gold);
    color:var(--gold-deep);
    background:var(--gold-soft);
  }
  .f-btn.attach .a-badge{
    background:var(--gold);
    color:#fff;
    font-size:10px;
    font-weight:700;
    width:17px; height:17px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }

  /* empty state */
  .empty{
    text-align:center;
    padding:90px 20px;
    color:var(--ink-faint);
  }
  .empty svg{width:48px; height:48px; stroke:var(--line); margin-bottom:18px;}
  .empty p{
    font-family:'Amiri', serif;
    font-size:17px;
    color:var(--ink-soft);
  }

  /* ========== MODALS ========== */
  .overlay{
    position:fixed; inset:0;
    background:rgba(30,46,61,.55);
    backdrop-filter:blur(4px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:30px;
  }
  .overlay.active{display:flex; animation:fadeIn .22s ease;}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .modal-box{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    width:min(940px, 100%);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 30px 70px -20px rgba(30,46,61,.4), 0 0 0 1px rgba(255,255,255,.5);
    animation:viewerIn .32s cubic-bezier(.22,.61,.36,1);
  }
  #viewerOverlay .modal-box{height:min(88vh, 800px);}
  #attachOverlay .modal-box{max-height:min(80vh, 640px);}
  @keyframes viewerIn{
    from{opacity:0; transform:scale(.97) translateY(8px);}
    to{opacity:1; transform:scale(1) translateY(0);}
  }
  .modal-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 22px;
    border-bottom:1px solid var(--line);
    background:var(--surface-2);
    flex-shrink:0;
  }
  .modal-top .m-title{
    font-family:'Markazi Text', serif;
    font-size:17px;
    font-weight:700;
    color:var(--navy-deep);
  }
  .m-close{
    width:34px; height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
    transition:background .18s ease, color .18s ease, border-color .18s ease;
    flex-shrink:0;
  }
  .m-close:hover{
    background:var(--navy);
    color:var(--paper);
    border-color:var(--navy);
  }
  .viewer-body{flex:1; background:#E8E4DA;}
  .viewer-body iframe{width:100%; height:100%; border:none;}

  .attach-body{
    padding:18px 22px 22px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:11px;
  }
  .attach-row{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    transition:border-color .18s ease, background .18s ease;
  }
  .attach-row:hover{border-color:#CFC7B2; background:var(--paper);}
  .attach-row .a-name{
    font-size:14.5px;
    font-weight:500;
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
    color:var(--navy-deep);
  }
  .attach-row .a-name .a-icon{
    width:34px; height:34px;
    border-radius:8px;
    background:var(--gold-soft);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    border:1px solid #E2D6B8;
  }
  .attach-row .a-name .a-icon svg{width:15px; height:15px; stroke:var(--gold-deep);}
  .attach-row .a-name span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .attach-row a.a-download{
    font-size:13px;
    color:var(--navy);
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
    text-decoration:none;
    padding:8px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    flex-shrink:0;
    transition:background .18s ease, border-color .18s ease, color .18s ease;
  }
  .attach-row a.a-download:hover{
    background:var(--navy);
    border-color:var(--navy);
    color:var(--paper);
  }
  .attach-row a.a-download svg{width:14px; height:14px;}

  footer{
    padding:24px clamp(20px,5vw,72px) 36px;
    color:var(--ink-faint);
    font-size:13px;
    text-align:center;
    border-top:1px solid var(--line-soft);
    font-family:'Amiri', serif;
  }
  footer span{color:var(--gold); margin:0 8px;}

  @media (max-width:560px){
    .screen-head{flex-direction:column; align-items:flex-start;}
    header{flex-direction:column; align-items:flex-start; gap:12px;}
    nav.crumbs{width:100%;}
    .file-row{align-items:flex-start;}
    .f-btn{font-size:12px; padding:7px 12px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">Bussnines for all</span>
      <span class="brand-tag">Academic Library</span>
    </div>
  </div>
  <nav class="crumbs" id="crumbs"></nav>
</header>

<main>

  <!-- شاشة 1: الدفعات -->
  <section class="screen active" id="screen-batches">
    <div class="screen-head">
      <div>
        <div class="screen-title">اختر قسم</div>
        <div class="screen-sub">حدد قسم للوصول إلى المواد الخاصة بها</div>
      </div>
    </div>
    <div class="grid" id="batchGrid"></div>
  </section>

  <!-- شاشة 2: المواد -->
  <section class="screen" id="screen-subjects">
    <div class="screen-head">
      <div>
        <div class="screen-title" id="subjectsTitle">المواد</div>
        <div class="screen-sub">اختر المادة لعرض الملفات المتاحة</div>
      </div>
    </div>
    <div class="grid" id="subjectGrid"></div>
  </section>

  <!-- شاشة 3: الملفات -->
  <section class="screen" id="screen-files">
    <div class="screen-head">
      <div>
        <div class="screen-title" id="filesTitle">الملفات</div>
      </div>
      <div class="file-count" id="fileCount"></div>
    </div>
    <div class="file-list" id="fileList"></div>
  </section>

</main>

<footer>Bussnines for all <span>◆</span></footer>

<!-- PDF Viewer -->
<div class="overlay" id="viewerOverlay">
  <div class="modal-box">
    <div class="modal-top">
      <span class="m-title" id="viewerTitle"></span>
      <button class="m-close" id="viewerClose" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="viewer-body">
      <iframe id="viewerFrame" src="" allow="autoplay"></iframe>
    </div>
  </div>
</div>

<!-- الملفات الإضافية -->
<div class="overlay" id="attachOverlay">
  <div class="modal-box">
    <div class="modal-top">
      <span class="m-title" id="attachTitle">الملفات الإضافية</span>
      <button class="m-close" id="attachClose" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="attach-body" id="attachList"></div>
  </div>
</div>

<script>
/* =========================================================
   البيانات — عدّل هنا فقط
   driveId = المعرف الخاص بالملف على Google Drive
========================================================= */

                { name: "Quiz 1", driveId: "REPLACE_WITH_ATTACH_ID_2" }
              ]
            },

        },



        
        {

            { name: "الفصل الثاني - جداول الحياة", driveId: "REPLACE_WITH_FILE_ID_5" }
          ]
        },



        
        {

        }
      ]

/* ========================================================= */

let state = { batch: null, subject: null };

const el = (sel) => document.querySelector(sel);
const crumbsEl = el("#crumbs");

function iconFolder(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`;
}
function iconBook(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`;
}
function iconFile(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>`;
}
function iconEye(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
}
function iconPaperclip(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.05 12.53 19.9a5 5 0 0 1-7.07-7.07l8.5-8.5a3.5 3.5 0 0 1 4.95 4.95l-8.5 8.5a2 2 0 1 1-2.83-2.83l7.79-7.79"/></svg>`;
}
function iconDownload(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>`;
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  el("#"+id).classList.add("active");
}

function renderCrumbs(){
  let parts = [{label:"الاقسام", action:() => goBatches()}];
  if(state.batch) parts.push({label: state.batch.name, action: () => goSubjects(state.batch.id)});
  if(state.subject) parts.push({label: state.subject.name, action: null});

  crumbsEl.innerHTML = parts.map((p, i) => {
    const isLast = i === parts.length - 1;
    const sep = i > 0 ? `<span class="sep">›</span>` : "";
    return `${sep}<span class="crumb ${isLast ? "current" : ""}" data-i="${i}">${p.label}</span>`;
  }).join("");

  crumbsEl.querySelectorAll(".crumb").forEach((elm, i) => {
    elm.addEventListener("click", () => { if(parts[i].action) parts[i].action(); });
  });
}

function goBatches(){
  state.batch = null; state.subject = null;
  renderCrumbs();
  showScreen("screen-batches");
}

function goSubjects(batchId){
  const batch = DATA.batches.find(b => b.id === batchId);
  state.batch = batch; state.subject = null;
  renderCrumbs();
  el("#subjectsTitle").textContent = batch.name;
  const grid = el("#subjectGrid");
  grid.innerHTML = batch.subjects.map(s => `
    <div class="card" tabindex="0" data-id="${s.id}">
      <div class="card-inner">
        <div class="icon">${iconBook()}</div>
        <div class="name">${s.name}</div>
        <div class="meta">${s.files.length} ملف</div>
      </div>
    </div>
  `).join("");
  grid.querySelectorAll(".card").forEach(c => {
    c.addEventListener("click", () => goFiles(c.dataset.id));
    c.addEventListener("keydown", e => { if(e.key === "Enter") goFiles(c.dataset.id); });
  });
  showScreen("screen-subjects");
}

function goFiles(subjectId){
  const subject = state.batch.subjects.find(s => s.id === subjectId);
  state.subject = subject;
  renderCrumbs();
  el("#filesTitle").textContent = subject.name;
  el("#fileCount").innerHTML = `<strong>${subject.files.length}</strong> ملف متاح`;

  const list = el("#fileList");
  if(subject.files.length === 0){
    list.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <p>لا توجد ملفات مضافة لهذه المادة بعد</p>
      </div>`;
  } else {
    list.innerHTML = subject.files.map((f, i) => {
      const hasAttach = f.attachments && f.attachments.length > 0;
      return `
      <div class="file-row" data-i="${i}">
        <div class="f-icon">${iconFile()}<span class="f-tag">PDF</span></div>
        <div class="f-body">
          <div class="f-name">${f.name}</div>
          ${hasAttach ? `<div class="f-meta">${f.attachments.length} ملف إضافي مرفق</div>` : ``}
        </div>
        <div class="f-actions">
          <button class="f-btn view" data-view="${i}">${iconEye()}عرض</button>
          ${hasAttach ? `<button class="f-btn attach" data-attach="${i}"><span class="a-badge">${f.attachments.length}</span>${iconPaperclip()}تحميل</button>` : ``}
        </div>
      </div>`;
    }).join("");

    list.querySelectorAll("[data-view]").forEach(btn => {
      btn.addEventListener("click", () => openViewer(subject.files[btn.dataset.view]));
    });
    list.querySelectorAll("[data-attach]").forEach(btn => {
      btn.addEventListener("click", () => openAttachments(subject.files[btn.dataset.attach]));
    });
  }
  showScreen("screen-files");
}

function renderBatches(){
  const grid = el("#batchGrid");
  grid.innerHTML = DATA.batches.map(b => `
    <div class="card" tabindex="0" data-id="${b.id}">
      <div class="card-inner">
        <div class="icon">${iconFolder()}</div>
        <div class="name">${b.name}</div>
        <div class="meta">${b.subjects.length} مادة</div>
      </div>
    </div>
  `).join("");
  grid.querySelectorAll(".card").forEach(c => {
    c.addEventListener("click", () => goSubjects(c.dataset.id));
    c.addEventListener("keydown", e => { if(e.key === "Enter") goSubjects(c.dataset.id); });
  });
}

/* ---------- PDF Viewer ---------- */
const viewerOverlay = el("#viewerOverlay");
const frame = el("#viewerFrame");
function openViewer(file){
  el("#viewerTitle").textContent = file.name;
  frame.src = `https://drive.google.com/file/d/${file.driveId}/preview`;
  viewerOverlay.classList.add("active");
}
function closeViewer(){
  viewerOverlay.classList.remove("active");
  frame.src = "";
}
el("#viewerClose").addEventListener("click", closeViewer);
viewerOverlay.addEventListener("click", (e) => { if(e.target === viewerOverlay) closeViewer(); });

/* ---------- الملفات الإضافية ---------- */
const attachOverlay = el("#attachOverlay");
function openAttachments(file){
  el("#attachTitle").textContent = `الملفات الإضافية — ${file.name}`;
  el("#attachList").innerHTML = file.attachments.map(a => `
    <div class="attach-row">
      <div class="a-name">
        <span class="a-icon">${iconFile()}</span>
        <span>${a.name}</span>
      </div>
      <a class="a-download" href="https://drive.google.com/uc?export=download&id=${a.driveId}" target="_blank" rel="noopener">
        ${iconDownload()}تحميل
      </a>
    </div>
  `).join("");
  attachOverlay.classList.add("active");
}
function closeAttachments(){
  attachOverlay.classList.remove("active");
}
el("#attachClose").addEventListener("click", closeAttachments);
attachOverlay.addEventListener("click", (e) => { if(e.target === attachOverlay) closeAttachments(); });

document.addEventListener("keydown", (e) => {
  if(e.key === "Escape"){ closeViewer(); closeAttachments(); }
});

/* ---------- init ---------- */
renderBatches();
renderCrumbs();
</script>

</body>
</html>
